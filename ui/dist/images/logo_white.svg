<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" fill="none" width="160" height="48">
  <!-- Mark: rounded square with "LS" initials — white version for dark header -->
  <rect width="48" height="48" rx="10" fill="rgba(255,255,255,0.12)"/>
  <!-- LS mark in accent color — stays orange, pops on dark accent header -->
  <text x="6" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#e07856" letter-spacing="-1">LS</text>

  <!-- Wordmark: white text for use on dark/accent header -->
  <text x="60" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="-0.3">LS Pocket</text>
</svg>
